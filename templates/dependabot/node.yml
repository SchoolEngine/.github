# SchoolEngine Dependabot template: node
# pnpm repositories (contracts, backend, parent-web, admin-web).
# Copy to .github/dependabot.yml; append container.yml where an image is built. Rules: DEPENDABOT.md in SchoolEngine/.github.
version: 2

updates:
  # Actions pinned by SHA in .github/workflows (every repository).
  # Dependabot updates the SHA and its version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    # A new release waits 7 days before a version-update PR (supply-chain
    # attacks are usually caught within days). Security updates are not delayed.
    cooldown:
      default-days: 7
    # "chore(deps): ..." / "chore(deps-dev): ...": passes the Quality Gate title check.
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "tech-debt"
    # Minor and patch version updates in one weekly PR; majors stay separate.
    # Security updates are never grouped, so they are never held back.
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # pnpm (package.json + pnpm-lock.yaml at the root).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    # A new release waits 7 days before a version-update PR (supply-chain
    # attacks are usually caught within days). Security updates are not delayed.
    cooldown:
      default-days: 7
    # "chore(deps): ..." / "chore(deps-dev): ...": passes the Quality Gate title check.
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "tech-debt"
    # Minor and patch version updates in one weekly PR; majors stay separate.
    # Security updates are never grouped, so they are never held back.
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Generated API clients are git-tag dependencies on the private contracts
    # repository (ADR-013, SchoolEngine/architecture#6): bumped by the contract
    # change procedure, not by Dependabot, until ADR-013 says otherwise.
    ignore:
      - dependency-name: "@usc/api-client"
      # @types/node follows the Node.js runtime we pin (Node 24 LTS): a newer
      # major describes APIs that do not exist at runtime. Move it with the LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript stays on 6.0.x in every repository: typescript-eslint supports
      # TypeScript < 6.1 only. Lift this rule when it supports TypeScript 7, and
      # bump every repository together. Minor, patch and security updates still come.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
