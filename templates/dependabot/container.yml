# SchoolEngine Dependabot template: container
# Block to append to updates: in any repository that builds an OCI image (backend, infrastructure).
# Append this entry to the updates: list of .github/dependabot.yml.
# Rules: DEPENDABOT.md in SchoolEngine/.github.
version: 2

updates:
  # Base images (FROM lines), pinned by digest (ADR-014). Dependabot looks for
  # files named Dockerfile; see DEPENDABOT.md for Containerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    # A new release waits 7 days before a version-update PR (supply-chain
    # attacks are usually caught within days). Security updates are not delayed.
    cooldown:
      default-days: 7
    # "chore(deps): ..." / "chore(deps-dev): ...": passes the Quality Gate title check.
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "tech-debt"
    # Minor and patch version updates in one weekly PR; majors stay separate.
    # Security updates are never grouped, so they are never held back.
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
