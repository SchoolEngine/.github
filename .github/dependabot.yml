# Dependabot configuration of SchoolEngine/.github, copied from the common template of
# SchoolEngine/.github (templates/dependabot/common.yml).
# Rules: DEPENDABOT.md in SchoolEngine/.github.
version: 2

updates:
  # Actions pinned by SHA in .github/workflows (every repository).
  # Dependabot updates the SHA and its version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    # A new release waits 7 days before a version-update PR (supply-chain
    # attacks are usually caught within days). Security updates are not delayed.
    cooldown:
      default-days: 7
    # "chore(deps): ..." / "chore(deps-dev): ...": passes the Quality Gate title check.
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "tech-debt"
    # Minor and patch version updates in one weekly PR; majors stay separate.
    # Security updates are never grouped, so they are never held back.
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
