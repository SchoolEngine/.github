name: Bug
description: Something behaves differently from the specification or the contract. It is a sub-issue of the lot epic.
title: "fix(<scope>): <imperative description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One ticket = one pull request (target under ~400 diff lines). After creating it, attach it as a sub-issue of the lot epic in `SchoolEngine/architecture`.
        The title follows Conventional Commits, in English, without the issue number.
  - type: input
    id: parent_epic
    attributes:
      label: Parent epic
      description: URL of the lot epic this ticket belongs to.
      placeholder: https://github.com/SchoolEngine/architecture/issues/1
    validations:
      required: true
  - type: input
    id: spec_reference
    attributes:
      label: Spec reference
      description: Requirement or section of the founding specification (FR-xx, §n), or the ADR this ticket implements.
      placeholder: "FR-05, §20"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this ticket exists.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens, and the steps to reproduce it (environment, version or commit, request or screen). Use synthetic data only, never a real user's data.
      value: "Steps to reproduce:\n1. \n2. \n\nObserved:\n"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead, with the spec or contract reference that says so.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable list, including a regression test that fails before the fix.
      value: "- [ ] \n"
    validations:
      required: true
  - type: dropdown
    id: contract_impact
    attributes:
      label: Contract impact
      description: Effect on the OpenAPI contract. A breaking change needs a prior explicit decision and the `breaking-change-approved` label.
      options:
        - none
        - additive
        - breaking
    validations:
      required: true
  - type: textarea
    id: technical_notes
    attributes:
      label: Technical notes
      description: Leads, constraints, modules and contracts touched.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Blocking tickets or decisions (owner/repo#n), or "None".
      value: None.
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: Spec §38 applies. Add the criteria specific to this ticket.
      value: |
        Per spec §38: acceptance criteria demonstrated, tests at every relevant level, green `Quality Gate`, no secret or new personal data in logs, contracts and clients regenerated if the API changed, documentation and repo map updated in the same PR, squash-merged into `develop` with Céline's approval, branch and worktree removed, verified on staging.
    validations:
      required: true
